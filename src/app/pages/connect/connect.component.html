@let content = connect();

<section class="page-hero">
  <div class="cw-container">
    <p class="cw-eyebrow">{{ content.eyebrow }}</p>
    <h1>{{ content.headline }}</h1>
    <p class="cw-muted">{{ content.intro }}</p>
  </div>
</section>

<section class="cw-section">
  <div class="cw-container connect-grid">
    <mat-card class="cw-dark-panel">
      <mat-card-content>
        <p class="cw-eyebrow">{{ content.eyebrow }}</p>
        <h2>{{ content.headline }}</h2>
        <p>{{ content.note }}</p>
        <a mat-flat-button [href]="content.ctaUrl" target="_blank" rel="noreferrer">
          {{ content.ctaLabel }}
          <mat-icon>open_in_new</mat-icon>
        </a>
      </mat-card-content>
    </mat-card>
    <mat-card appearance="outlined" class="cw-surface-card">
      <mat-card-content>
        <p class="cw-eyebrow">Connect</p>
        <div class="social-list">
          @for (item of navigation().social; track item.url) {
            <a class="social-link" [href]="item.url" target="_blank" rel="noreferrer">
              <span>{{ item.label }}</span>
              <mat-icon>north_east</mat-icon>
            </a>
          }
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</section>
