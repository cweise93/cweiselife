name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Override the deployment environment (defaults by branch)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - staging
          - production

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment configuration
        id: vars
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          TRIGGERED_ENV: ${{ github.event.inputs.environment }}
          PROD_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          STAGING_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_STAGING }}
          PROD_APP_SETTINGS: ${{ secrets.AZURE_APP_SETTINGS_PROD }}
          STAGING_APP_SETTINGS: ${{ secrets.AZURE_APP_SETTINGS_STAGING }}
        run: |
          env_name="${TRIGGERED_ENV:-auto}"
          if [ "$env_name" = "auto" ]; then
            if [ "$BRANCH_NAME" = "main" ]; then
              env_name="production"
            else
              env_name="staging"
            fi
          fi

          if [ "$env_name" = "production" ]; then
            if [ -z "$PROD_WEBAPP_NAME" ]; then
              echo "::error::Missing secret AZURE_WEBAPP_NAME_PROD" >&2
              exit 1
            fi
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "build_configuration=production" >> "$GITHUB_OUTPUT"
            echo "node_env=production" >> "$GITHUB_OUTPUT"
            echo "webapp_name=$PROD_WEBAPP_NAME" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "app_settings=$PROD_APP_SETTINGS" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$STAGING_WEBAPP_NAME" ]; then
              echo "::error::Missing secret AZURE_WEBAPP_NAME_STAGING" >&2
              exit 1
            fi
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "build_configuration=staging" >> "$GITHUB_OUTPUT"
            echo "node_env=staging" >> "$GITHUB_OUTPUT"
            echo "webapp_name=$STAGING_WEBAPP_NAME" >> "$GITHUB_OUTPUT"
            echo "slot=staging" >> "$GITHUB_OUTPUT"
            echo "app_settings=$STAGING_APP_SETTINGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Angular build (fails fast if broken)
        run: npm run build -- --configuration ${{ steps.vars.outputs.build_configuration }}
        env:
          NODE_ENV: ${{ steps.vars.outputs.node_env }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Apply App Service configuration
        if: ${{ steps.vars.outputs.app_settings != '' }}
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ steps.vars.outputs.webapp_name }}
          slot-name: ${{ steps.vars.outputs.slot }}
          app-settings-json: ${{ steps.vars.outputs.app_settings }}

      - name: Prepare deployment artifacts
        run: |
          rm -rf release
          mkdir -p release
          cp -R server package.json package-lock.json release/
          cp -R dist release/dist
          cd release
          npm ci --omit=dev
          cd ..

      - name: Create deployment package
        run: |
          cd release
          zip -r ../deployment.zip . -x "*.git*" -x ".github/*" -x "*.cache" -x "*.log"
          cd ..

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.vars.outputs.webapp_name }}
          slot-name: ${{ steps.vars.outputs.slot }}
          package: deployment.zip

      - name: Logout from Azure
        if: always()
        run: az logout
