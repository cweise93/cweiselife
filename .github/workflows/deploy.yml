name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main    # or your primary branch
      - gh-pages  # optional, triggers deploy if you update gh-pages directly

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0  # Angular requires >= v20.19 or v22.12

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Angular CLI globally
      - name: Install Angular CLI
        run: npm install -g @angular/cli@16.2.0

      # Step 5: Build Angular app for production
      - name: Build Angular app
        run: ng build --configuration production --project cweise-com-authority-hub

      # Step 6: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/cweise-com-authority-hub
          # Optional: if your repo is private
          # force_orphan: true
          # user_name: "Your Name"
          # user_email: "you@example.com"