name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger deployment when pushing to main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build Angular app for production
      - name: Build Angular app
        run: npm run build -- --configuration production --base-href "/"

      # 5. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/cweise-com-authority-hub
          # If your angular.json outputPath changes, update this path accordingly
          # make sure this path exists after 'ng build'