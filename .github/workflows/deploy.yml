name: Build and Deploy Angular to GitHub Pages

# Trigger workflow on pushes to main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build Angular app for production
      - name: Build Angular app
        run: |
          npm run build -- --project cweise-com-authority-hub --configuration production --output-path docs --base-href "/"

      # 5. Deploy the contents of docs/ to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: "Charles Weise"
          user_email: "your-email@example.com"