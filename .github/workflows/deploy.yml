name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on changes to your main branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to push to gh-pages
      pages: write
      id-token: write

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Match Angular CLI requirements
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install Angular CLI globally
      - name: Install Angular CLI
        run: npm install -g @angular/cli@latest

      # Build the Angular app
      - name: Build Angular app
        run: ng build cweise-com-authority-hub --configuration production --output-path dist/cweise-com-authority-hub --base-href /  # base-href for GitHub Pages

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/cweise-com-authority-hub
          # Optional: custom domain file will be used if exists
          cname: cweise.com
          allow_empty_commit: false