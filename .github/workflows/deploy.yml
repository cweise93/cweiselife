name: Build and Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

env:
  C2PATOOL_VERSION: 0.26.67

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install c2patool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/c2patool.tar.gz "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v${C2PATOOL_VERSION}/c2patool-v${C2PATOOL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/c2patool.tar.gz -C /tmp
          install /tmp/c2patool/c2patool "$HOME/.local/bin/c2patool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/c2patool" --version

      - name: Install dependencies
        run: npm ci

      - name: Verify C2PA manifests
        run: npm run c2pa:verify

      - name: Build Angular app
        run: npm run build

      - name: Flatten browser output into publish root
        run: |
          cp -R dist/browser/. dist/

      - name: Verify dist folder
        run: ls -R dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: cweise.com
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_history: true
