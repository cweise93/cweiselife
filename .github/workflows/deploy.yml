name: Build and Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli@16

      - name: Build Angular app
        run: |
          npx ng build cweise-com-authority-hub \
            --configuration production \
            --output-path dist/cweise-com-authority-hub \
            --base-href /cweise.com/

      - name: Ensure CNAME for custom domain
        run: |
          echo "cweise.com" > dist/cweise-com-authority-hub/CNAME

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/cweise-com-authority-hub
          clean: true