# Azure DevOps → Azure Static Web Apps deployment
# Builds the Angular client and deploys it to the Static Web App you purchased.

trigger:
  branches:
    include:
      - main
      - staging

pr:
  branches:
    include:
      - main
      - staging

pool:
  name: Default
  demands:
    - Agent.Name -equals home

variables:
  node_version: '20.x'
  app_location: 'dist/cweiselife/browser'
  api_location: ''
  app_artifact_location: 'dist/cweiselife/browser'

stages:
  - stage: build_and_deploy
    displayName: Build Angular and deploy to Azure Static Web Apps
    jobs:
      - job: deploy
        displayName: Deploy $(Build.SourceBranchName)
        steps:
          - checkout: self

          - task: NodeTool@0
            inputs:
              versionSpec: $(node_version)
            displayName: Use Node.js $(node_version)

          - script: npm ci
            displayName: Install dependencies

          - script: |
              config=production
              environment=production
              if [ "$(Build.SourceBranchName)" = "staging" ]; then
                config=staging
                environment=staging
              fi
              echo "Angular configuration: $config"
              echo "Static Web Apps environment: $environment"
              echo "##vso[task.setvariable variable=ANGULAR_CONFIGURATION]$config"
              echo "##vso[task.setvariable variable=SWA_ENVIRONMENT]$environment"
            displayName: Resolve deployment environment

          - script: npm run build -- --configuration $(ANGULAR_CONFIGURATION) --output-hashing all
            displayName: Build Angular ($(ANGULAR_CONFIGURATION))

          - script: |
              set -euo pipefail
              target="$(Build.SourcesDirectory)/$(app_artifact_location)"
              if [ ! -d "$target" ]; then
                echo "Build output folder $target not found" >&2
                exit 1
              fi
              cp "$(Build.SourcesDirectory)/staticwebapp.config.json" "$target/staticwebapp.config.json"
            displayName: Copy staticwebapp.config.json into artifact

          - task: AzureStaticWebApp@0
            displayName: Deploy to Azure Static Web Apps
            inputs:
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
              app_location: $(app_location)
              app_artifact_location: $(app_artifact_location)
              api_location: $(api_location)
              skip_app_build: true
              skip_api_build: true
              production_branch: main
              environment_name: $(SWA_ENVIRONMENT)
